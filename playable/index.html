<style>

:#fffdf6;box-shadow:0 2px 5px #34422c12}.cropicon{width:64px;height:64px;flex-shrink:0}.cropbig{width:150px;height:150px;display:block;margin:20px auto}.listcard{display:flex;align-items:center;gap:12px}.listcard .primary,.listcard .secondary{padding:10px 14px;min-height:42px}.price{font-weight:900;color:#855c28}.line{height:1px;background:var(--line);margin:14px 0}nav{position:fixed;bottom:0;width:min(460px,100%);display:flex;z-index:6;background:#fffcefef;border-top:1px solid #d5d8bd;backdrop-filter:blur(12px);padding:10px 8px max(10px,env(safe-area-inset-bottom))}nav button{flex:1;border:0;background:none;color:#829076;font-size:11px;min-height:50px}nav button span{display:block;font-size:22px;margin-bottom:1px}nav button.active{color:#356541;font-weight:900}.title{padding:60px 28px 35px;text-align:center;background:linear-gradient(#f9e3a5,#e0e7bf 65%,#fff9e9)}.eyebrow{font-size:11px;letter-spacing:3px;font-weight:900;color:#7a875d}.title h1{font-size:44px;line-height:1.2;margin:20px 0 12px}.titleart{width:100%;height:235px}.title .primary{margin-top:24px}.title .secondary{margin-top:12px}.tag{background:#e8efd9;color:#517147;padding:3px 8px;border-radius:9px;font-size:11px;font-weight:800}.farmcontent{padding-bottom:100px}.farmintro{padding:20px 22px 9px}.farmintro h2{font-size:25px}.world{position:relative;background:linear-gradient(#f4dda5 0,#e7e6bb 39%,#a9c680 40%,#b2cc88 100%);padding:0 17px 24px;isolation:isolate;border-bottom:5px solid #88a568}.landscape{width:100%;height:165px;display:block;margin-bottom:-10px}.plots{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:12px 9px;padding:0 6px;z-index:1}.plot{border:0;background:none;position:relative;padding:0;min-height:109px}.soil{height:83px;position:relative;border-radius:18px;background:repeating-linear-gradient(0deg,#a76d46 0,#a76d46 15px,#bb8455 16px,#bb8455 20px);border:4px solid #825336;box-shadow:0 7px 0 #794b30,inset 0 2px 1px #deb181;transform:rotate(-2deg)}.plot:nth-child(2n) ant}@media(min-width:700px){body{padding:26px;background:radial-gradient(circle at 15% 30%,#eceddb 0,transparent 35%),#d4e0c6}.app{min-height:calc(100dvh - 52px);border-radius:32px;border:8px solid #fffbea;box-shadow:0 20px 100px #4f704b2c}nav{width:444px;border-radius:0 0 24px 24px;bottom:34px}.content{min-height:calc(100dvh - 146px)}.title{min-height:calc(100dvh - 68px)}}

<script>
const KEY='afterHoursFarmV2Local';
const CROPS={lettuce:{name:'ผักกาด',time:120000,buy:10,sell:18},radish:{name:'หัวไชเท้า',time:300000,buy:20,sell:38},carrot:{name:'แครอต',time:600000,buy:35,sell:70},pumpkin:{name:'ฟักทอง',time:1200000,buy:60,sell:125}};
const initial=()=>({version:2,coins:120,xp:0,seeds:{lettuce:3,radish:2,carrot:0,pumpkin:0},produce:{lettuce:0,radish:0,carrot:0,pumpkin:0},plots:[{stage:'wild'},{stage:'wild'},{stage:'tilled'},{stage:'planted',crop:'lettuce',readyAt:null},{stage:'growing',crop:'radish',readyAt:Date.now()+120000},{stage:'growing',crop:'lettuce',readyAt:Date.now()-1000}],upgrades:{plots:false,can:false},orderClaimed:false,demoOffset:0,settings:{sound:false,motion:true},savedAt:Date.now()});
let state,hasSave=false;try{let raw=localStorage.getItem(KEY);state=raw?JSON.parse(raw):null;hasSave=Boolean(state&&state.version===2);if(!hasSave)state=initial();}catch{state=initial()}
let route='title',history=[],selectedPlot=2,bagTab='produce',shopQty={},sellQty={},lastHarvest=null,toastTimer,audioCtx;
const $=s=>document.querySelector(s),icon=(id,cls='cropicon')=>`<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`,num=n=>Number(n).toLocaleString('th-TH'),now=()=>Date.now()+state.demoOffset;
const stage=p=>p.stage==='growing'&&p.readyAt<=now()?'ready':p.stage;
const remaining=p=>Math.max(0,(p.readyAt||now())-now());
const time=t=>`${Math.floor(t/60000)}:${String(Math.ceil((t%60000)/1000)%60).padStart(2,'0')}`;
function save(){state.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state));hasSave=true}catch{toast('เบราว์เซอร์นี้ไม่อนุญาตให้บันทึกข้อมูล')}}
function sound(){if(!state.settings.sound)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='sine';o.frequency.setValueAtTime(660,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(880,audioCtx.currentTime+.1);g.gain.setValueAtTime(.025,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.16);o.start();o.stop(audioCtx.currentTime+.17)}catch{}}
function toast(text){clearTimeout(toastTimer);let el=$('#toast');el.className='toast';el.textContent=text;el.hidden=false;toastTimer=setTimeout(()=>el.hidden=true,2400)}
function go(to,push=true){if(push&&to!==route)history.push(route);route=to;closeDialog();render();window.scrollTo(0,0)}
function back(){go(history.pop()||'farm',false)}
function nav(){return `<nav aria-label="เมนูหลัก">${[['farm','♧','สวนของฉัน'],['village','⌂','หมู่บ้าน'],['bag','▣','กระเป๋า'],['shop','✿','ร้านเมล็ด']].map(([r,i,t])=>`<button data-action="go" data-route="${r}" data-testid="nav-${r}" class="${route===r?'active':''}"><span>${i}</span>${t}</button>`).join('')}</nav>`}
function header(title,sub='สวนหลังเลิกงาน'){return `<header><button class="iconbtn" data-action="${route==='farm'?'go':'back'}" ${route==='farm'?'data-route="settings"':''} aria-label="${route==='farm'?'ตั้งค่า':'ย้อนกลับ'}" data-testid="${route==='farm'?'open-settings':'back'}">${route==='farm'?'⚙':'‹'}</button><div class="grow"><div class="muted tiny">${sub}</div><h1>${title}</h1></div><div class="pill" data-testid="coins">◉ ${num(state.coins)}</div></header>`}
function intro(title,text){return `<div class="intro"><h2>${title}</h2><p class="muted">${text}</p></div>`}
function landscape(){return `<svg class="landscape" viewBox="0 0 400 165" aria-hidden="true"><circle cx="318" cy="35" r="24" fill="#f9efbe"/><path d="M0 83Q67 27 138 88 207 29 292 83 340 57 400 78V165H0" fill="#b0be83"/><path d="M0 113Q103 70 193 112 310 72 400 108V165H0" fill="#94af70"/><g fill="#76945c" stroke="#617f4e" stroke-width="3"><path d="M22 65q-25-2-20-25 2-22 22-18 19-6 24 16 11 26-26 27"/><path d="M372 82q-31-2-25-31 2-25 25-20 23-7 28 19 13 30-28 32"/></g><path d="M23 56v54m349-39v57" stroke="#87704a" stroke-width="7"/><g stroke="#eaddae" stroke-width="5"><path d="M0 136h400M0 121h400M10 117v28m23-28v28m23-28v28m23-28v28m23-28v28m23-28v28m23-28v28m23-28v28m23-28v28m23-28v28m23-28v28m23-28v28m23-28v28m23-28v28m23-28v28m23-28v28m23-28v28"/></g><use href="#house" x="71" y="19" width="102" height="102"/><use href="#farmer" x="206" y="77" width="74" height="74"/><use href="#cat" x="284" y="105" width="55" height="55"/><path d="M162 121q10-8 18 0m-20 8q11-7 23 0" stroke="#7c9b5d" stroke-width="4" fill="none"/></svg>`}
function titlePage(){return `<section class="title"><div class="eyebrow">A LITTLE GARDEN, A GOOD EVENING</div><h1>สวนหลัง<br>เลิกงาน<span style="color:#ad8246">.</span></h1><p class="muted">วางเรื่องวุ่น ๆ แล้วมาปลูกความสุขกัน</p><div class="titleart">${landscape()}</div><div class="row center" style="justify-content:center;gap:7px"><span class="chip">ปลูกผัก</span><span class="chip">รอเติบโต</span><span class="chip">เก็บเกี่ยว</span></div><button class="primary wide" data-action="continue" data-testid="continue">${hasSave?'กลับไปสวนของฉัน':'เข้าสวนครั้งแรก'} ↗</button><button class="secondary wide" data-action="new" data-testid="new-game">เริ่มสวนใหม่</button><p class="footerhint">ต้นแบบเล่นได้ · ข้อมูลเก็บในเบราว์เซอร์นี้<br>ผักไม่เหี่ยวเฉา ระหว่างที่คุณพัก</p></section>`}
function farmPage(){return `${header('สวนของมะลิ')}<div class="farmcontent"><div class="farmintro row between"><div><div class="eyebrow">AFTER HOURS · YOUR LITTLE ESCAPE</div><h2>เย็นนี้ ปลูกอะไรดี?</h2><p class="muted">สวนเล็ก ๆ ที่ค่อย ๆ โตไปกับคุณ</p></div>${icon('cat','hello')}</div><section class="world" aria-label="แปลงผัก">${landscape()}<div class="plots">${state.plots.map((p,i)=>{let s=stage(p),label={wild:'ขุดแปลง +',tilled:'ปลูกเมล็ด +',planted:'รดน้ำให้หน่อย',growing:time(remaining(p)),ready:'เก็บเกี่ยวได้แล้ว'}[s];return `<button class="plot ${s==='ready'?'ready':''}" data-action="plot" data-index="${i}" data-testid="plot-${i}" aria-label="แปลง ${i+1} ${p.crop?CROPS[p.crop].name+' ':''}${label}"><div class="soil ${s}">${s==='wild'?icon('sprout'):s==='tilled'?'<span class="symbol" style="color:#e8be80">＋</span>':icon(s==='ready'?p.crop:'sprout')}${s==='ready'?'<span class="sparkle">✦</span>':''}</div><span class="plotlabel" ${s==='growing'?`data-timer="${i}"`:''}>${s==='planted'?'◌ ':s==='growing'?'◷ ':''}${label}</span></button>`}).join('')}</div></section><div class="farmtoolbar"><button class="secondary" data-action="demo" data-testid="demo-time">◷ เร่งเวลาเดโม +5 นาที</button>${state.upgrades.can?'<button class="primary" data-action="waterall" data-testid="water-all">♧ รดน้ำทุกแปลง</button>':'<button class="secondary" data-action="go" data-route="upgrades" data-testid="farm-upgrades">＋ ขยายสวน</button>'}</div><div class="farmcards"><button class="card row" style="text-align:left" data-action="go" data-route="orders" data-testid="farm-orders">${icon('lettuce')}<div class="grow"><span class="muted tiny">จดหมายจากคุณยาย</span><h3>${state.orderClaimed?'ขอบใจสำหรับผักสดนะ':'ขอผักกาดสด 2 หัว'}</h3><span class="price">${state.orderClaimed?'ส่งเรียบร้อยแล้ว ✓':'รางวัล 45 เหรียญ + 20 XP'}</span></div><b>›</b></button><div class="notice">✦ ผักโตต่อได้แม้ปิดหน้าเว็บ และพร้อมรอให้คุณกลับมาเก็บ</div></div></div>${nav()}`}
function seedsPage(){return `${header('เลือกเมล็ดผัก')}<div class="content">${intro('เริ่มจากเมล็ดเล็ก ๆ',`เลือกปลูกในแปลงที่ ${selectedPlot+1} · ใช้ 1 เมล็ดต่อแปลง`)}<div class="stack">${Object.entries(CROPS).map(([id,c])=>`<div class="card listcard">${icon(id)}<div class="grow"><h3>${c.name}</h3><div class="muted">โตใน ${c.time/60000} นาที · ขาย ${c.sell} ◉</div><span class="tag">มี ${state.seeds[id]} เมล็ด</span></div><button class="primary" data-action="plant" data-crop="${id}" data-testid="plant-${id}" ${state.seeds[id]<1?'disabled':''}>ปลูก</button></div>`).join('')}<button class="secondary wide" data-action="go" data-route="shop">แวะซื้อเมล็ดเพิ่ม ↗</button></div></div>${nav()}`}
function growingPage(){const p=state.plots[selectedPlot],c=CROPS[p.crop],s=stage(p),ready=s==='ready';return `${header('ดูแลแปลงผัก')}<div class="content center">${intro(c.name,`แปลงที่ ${selectedPlot+1} · เก็บเกี่ยวได้ 1 หัว`)}<div class="card">${icon(ready?p.crop:'sprout','cropbig')}<span class="tag">${s==='planted'?'รอน้ำหยดแรก':ready?'พร้อมเก็บเกี่ยว':'กำลังค่อย ๆ เติบโต'}</span><div class="bigtime roomy" data-detail-timer>${s==='planted'?'รดน้ำกันเถอะ':ready?'โตแล้ว!':time(remaining(p))}</div><p class="muted">${s==='planted'?'รดน้ำหนึ่งครั้ง แล้วนาฬิกาการเติบโตจะเริ่มเดิน':ready?'เก็บผักสดใส่กระเป๋าได้เลย':'พักได้เต็มที่ ไม่ต้องรดน้ำซ้ำ และผักไม่เหี่ยว'}</p><div class="progress"><i style="width:${s==='planted'?0:ready?100:Math.max(0,100-remaining(p)/c.time*100)}%"></i></div><button class="${s==='growing'?'secondary':'primary'} wide" data-action="${s==='planted'?'water':ready?'harvest':'go'}" data-route="farm" data-index="${selectedPlot}" data-testid="crop-main-action">${s==='planted'?'♧ รดน้ำ':ready?'เก็บเกี่ยวผักสด':'กลับไปดูสวน'}</button></div><button class="inlinebutton roomy" data-action="go" data-route="farm">กลับสวน · เร่งเวลาเดโมได้ที่หน้าสวน</button></div>${nav()}`}
function harvestPage(){if(!lastHarvest)return farmPage();let c=CROPS[lastHarvest];return `${header('ผลผลิตของวันนี้')}<div class="content center"><div class="confetti">✦ ✧ ✦</div>${intro('เก็บความสุขได้แล้ว!',`ผัก${c.name==='ผักกาด'?'กาด':c.name}สด ๆ จากสวนของคุณ`)}<div class="harvestart">${icon(lastHarvest)}</div><h2>${c.name} +1</h2><p class="muted">เก็บเข้ากระเป๋าเรียบร้อยแล้ว</p><div class="card roomy"><div class="row between"><span>มีในกระเป๋าตอนนี้</span><b>${state.produce[lastHarvest]} หัว</b></div><div class="line"></div><div class="row between"><span>ราคาขายต่อหัว</span><b class="price">${c.sell} ◉</b></div></div><div class="stack roomy"><button class="primary wide" data-action="go" data-route="farm" data-testid="harvest-done">กลับไปปลูกต่อ</button><button class="secondary wide" data-action="go" data-route="bag">เปิดกระเป๋าผลผลิต</button></div></div>${nav()}`}
function bagPage(){let src=bagTab==='produce'?state.produce:state.seeds;return `${header('กระเป๋าของฉัน')}<div class="content">${intro('สิ่งเล็ก ๆ ที่เก็บไว้','ผลผลิตจากมือเรา กับเมล็ดพันธุ์ของวันพรุ่งนี้')}<div class="tabs"><button class="${bagTab==='produce'?'active':''}" data-action="bagtab" data-tab="produce" data-testid="bag-produce">ผลผลิต</button><button class="${bagTab==='seeds'?'active':''}" data-action="bagtab" data-tab="seeds" data-testid="bag-seeds">เมล็ดพันธุ์</button></div><div class="stack">${Object.entries(CROPS).map(([id,c])=>`<div class="card listcard">${icon(id)}<div class="grow"><h3>${c.name}</h3><p class="muted">${bagTab==='produce'?`ขายได้ ${c.sell} เหรียญต่อหัว`:`เติบโตใน ${c.time/60000} นาที`}</p></div><b class="qty" data-testid="bag-${id}">${src[id]}</b></div>`).join('')}<button class="primary wide" data-action="go" data-route="${bagTab==='produce'?'market':'shop'}" data-testid="bag-next">${bagTab==='produce'?'ไปขายที่ตลาด ↗':'ซื้อเมล็ดเพิ่ม ↗'}</button></div></div>${nav()}`}
function rescueEligible(){return state.coins<10&&Object.values(state.seeds).every(n=>n===0)&&Object.values(state.produce).every(n=>n===0)&&state.plots.every(p=>!p.crop)}
function qtyControls(type,id,q,max){return `<div class="stepper"><button aria-label="ลดจำนวน ${CROPS[id].name}" data-action="qty" data-kind="${type}" data-crop="${id}" data-delta="-1" ${q<=1?'disabled':''}>−</button><b data-testid="${type}-qty-${id}">${q}</b><button aria-label="เพิ่มจำนวน ${CROPS[id].name}" data-action="qty" data-kind="${type}" data-crop="${id}" data-delta="1" ${q>=max?'disabled':''}>＋</button></div>`}
function shopPage(){return `${header('ร้านเมล็ดของป้าพร')}<div class="content">${intro('วันนี้มีเมล็ดดี ๆ มาฝาก','เลือกจำนวนก่อนซื้อ เมล็ดจะเข้ากระเป๋าทันที')}<div class="stack">${Object.entries(CROPS).map(([id,c])=>{let q=shopQty[id]||1;return `<div class="card"><div class="listcard">${icon(id)}<div class="grow"><h3>${c.name}</h3><div class="muted">${c.time/60000} นาที · ขายได้ ${c.sell} ◉</div><div class="price">เมล็ดละ ${c.buy} เหรียญ</div></div><span class="tag">มี ${state.seeds[id]}</span></div><div class="line"></div><div class="row between">${qtyControls('shop',id,q,99)}<button class="primary" data-action="buy" data-crop="${id}" data-testid="buy-${id}" ${state.coins<c.buy*q?'disabled':''}>ซื้อ ${c.buy*q} ◉</button></div>${state.coins<c.buy*q?'<p class="muted tiny roomy">เหรียญยังไม่พอ ลองขายผลผลิตที่ตลาด</p>':''}</div>`}).join('')}${rescueEligible()?'<div class="hero-callout"><h3>ป้าพรมีเมล็ดแบ่งให้</h3><p class="muted">เริ่มใหม่ได้เสมอ รับเมล็ดผักกาดฟรี 1 เมล็ด</p><button class="primary wide roomy" data-action="rescue" data-testid="rescue-seed">รับเมล็ดช่วยเริ่มใหม่</button></div>':''}<button class="secondary wide" data-action="go" data-route="market">ไปตลาดขายผลผลิต</button></div></div>${nav()}`}
function marketPage(){return `${header('ตลาดเย็นของหมู่บ้าน')}<div class="content">${intro('ผักสดจากสวนเรา','ขายเท่าที่ต้องการ เก็บบางส่วนไว้ส่งคำขอได้')}<div class="stack">${Object.entries(CROPS).map(([id,c])=>{let n=state.produce[id],q=Math.min(sellQty[id]||1,Math.max(1,n));return `<div class="card"><div class="listcard">${icon(id)}<div class="grow"><h3>${c.name}</h3><p class="muted">มี ${n} หัว · ราคาหัวละ ${c.sell} ◉</p></div></div><div class="line"></div><div class="row between">${qtyControls('sell',id,q,Math.max(1,n))}<button class="primary" data-action="sell" data-crop="${id}" data-testid="sell-${id}" ${n<q?'disabled':''}>ขาย ${c.sell*q} ◉</button></div></div>`}).join('')}<button class="secondary wide" data-action="go" data-route="orders">ดูคำขอของชาวบ้าน</button></div></div>${nav()}`}
function ordersPage(){return `${header('กระดานคำขอ')}<div class="content">${intro('ปลูกผัก แบ่งความสุข','คำขอเล็ก ๆ จากเพื่อนบ้าน ไม่มีเวลาหมดอายุ')}<div class="hero-callout row">${icon('farmer','hello')}<div><h3>มื้อเย็นของคุณยาย</h3><p class="muted">“อยากทำซุปผักให้หลาน ขอผักกาดสดหน่อยนะ”</p></div></div><div class="card roomy"><div class="listcard">${icon('lettuce')}<div class="grow"><h3>ผักกาด 2 หัว</h3><div class="muted">ในกระเป๋า ${state.produce.lettuce} / 2 หัว</div></div><span class="tag">${state.orderClaimed?'ส่งแล้ว ✓':'คำขอพิเศษ'}</span></div><div class="line"></div><div class="row between"><span>รางวัล</span><b class="price">45 เหรียญ + 20 XP</b></div><button class="primary wide roomy" data-action="order" data-testid="claim-order" ${state.orderClaimed||state.produce.lettuce<2?'disabled':''}>${state.orderClaimed?'ส่งให้คุณยายเรียบร้อยแล้ว ✓':'ส่งผักให้คุณยาย'}</button><p class="muted tiny center roomy">${state.orderClaimed?'คุณยายฝากคำขอบคุณมาให้ · คำขอนี้รับรางวัลได้ครั้งเดียว':'การส่งจะใช้ผักกาด 2 หัวจากกระเป๋า'}</p></div><div class="notice roomy">ประสบการณ์สะสม ${state.xp} XP · การเก็บเกี่ยวปกติไม่เพิ่ม XP</div><button class="secondary wide roomy" data-action="go" data-route="farm">กลับไปดูสวน</button></div>${nav()}`}
function upgradesPage(){return `${header('โรงไม้ของพี่ต้น')}<div class="content">${intro('ค่อย ๆ ทำสวนให้เป็นของเรา','อัปเกรดถาวร ซื้อแต่ละอย่างได้ครั้งเดียว')}<div class="stack">${[['plots','▦','เพิ่มพื้นที่ปลูก','ขยายจาก 6 เป็น 9 แปลง ได้แปลงใหม่พร้อมขุด 3 แปลง',180],['can','♧','บัวรดน้ำใบใหญ่','รดน้ำทุกแปลงที่ปลูกเมล็ดไว้พร้อมกัน ด้วยปุ่มเดียวบนหน้าสวน',150]].map(([id,emoji,name,desc,price])=>`<div class="card"><div class="row"><span style="font-size:45px;color:#ac8851">${emoji}</span><div><h3>${name}</h3><p class="muted">${desc}</p></div></div><button class="${state.upgrades[id]?'secondary':'primary'} wide roomy" data-action="upgrade" data-upgrade="${id}" data-testid="upgrade-${id}" ${state.upgrades[id]||state.coins<price?'disabled':''}>${state.upgrades[id]?'ซื้อแล้ว ✓':`ซื้อ ${price} เหรียญ`}</button>${!state.upgrades[id]&&state.coins<price?'<p class="muted tiny center roomy">เก็บเหรียญเพิ่มอีกนิด แล้วค่อยกลับมานะ</p>':''}</div>`).join('')}<button class="secondary wide" data-action="go" data-route="farm">กลับสวนของฉัน</button></div></div>${nav()}`}
function villagePage(){return `${header('หมู่บ้านยามเย็น')}<div class="content">${intro('แวะทักทายกันหน่อย','แตะบ้านแต่ละหลัง เพื่อแวะร้านและคุยกับชาวบ้าน')}<div class="village"><div class="path"></div>${[['shop','shop','ร้านป้าพร'],['market','market','ตลาดเย็น'],['workshop','upgrades','โรงไม้พี่ต้น'],['orders','orders','บ้านคุณยาย']].map(([cls,r,t])=>`<button class="building ${cls}" data-action="go" data-route="${r}" data-testid="village-${r}">${icon('house')}<b>${t} ↗</b></button>`).join('')}</div><button class="card row wide" data-action="chat" style="text-align:left" data-testid="village-chat">${icon('farmer','hello')}<div class="grow"><h3>มะลิ · เพื่อนบ้าน</h3><p class="muted">วันนี้ปลูกผักไปถึงไหนแล้ว?</p></div><b>พูดคุย ›</b></button><button class="secondary wide roomy" data-action="go" data-route="farm">เดินกลับสวน</button></div>${nav()}`}
function settingsPage(){return `${header('มุมพักของเรา')}<div class="content">${intro('ปรับให้สบายใจ','สวนจะบันทึกทุกครั้งที่คุณปลูก ซื้อ ขาย หรือเก็บเกี่ยว')}<div class="card stack"><div class="check"><div><h3>เสียงตอบรับเบา ๆ</h3><p class="muted">เสียงสั้น ๆ เมื่อแตะหรือเก็บเกี่ยว</p></div><button class="switch ${state.settings.sound?'on':''}" data-action="toggle" data-setting="sound" role="switch" aria-checked="${state.settings.sound}" aria-label="เสียงตอบรับ" data-testid="toggle-sound"></button></div><div class="line"></div><div class="check"><div><h3>ลดการเคลื่อนไหว</h3><p class="muted">แสดงหน้าจอแบบนิ่งและเรียบง่าย</p></div><button class="switch ${!state.settings.motion?'on':''}" data-action="toggle" data-setting="motion" role="switch" aria-checked="${!state.settings.motion}" aria-label="ลดการเคลื่อนไหว" data-testid="toggle-motion"></button></div></div><div class="card roomy"><h3>สวนนี้อยู่ในเบราว์เซอร์ของคุณ</h3><p class="muted roomy">ไม่ต้องสมัครสมาชิก การล้างข้อมูลเว็บไซต์อาจทำให้สวนนี้หายไป</p><button class="secondary wide roomy" data-action="save" data-testid="save-game">บันทึกสวนตอนนี้</button></div><div class="stack roomy"><button class="secondary wide" data-action="go" data-route="title">กลับหน้าชื่อเกม</button><button class="inlinebutton" style="color:#a45947" data-action="reset" data-testid="reset-game">เริ่มสวนใหม่ทั้งหมด</button></div><div class="footerhint">สวนหลังเลิกงาน · Interactive prototype v2<br>ไม่มีการชำระเงินหรือเงินจริง</div></div>${nav()}`}
function render(){document.body.classList.toggle('no-motion',!state.settings.motion);$('#app').innerHTML=({title:titlePage,farm:farmPage,seeds:seedsPage,growing:growingPage,harvest:harvestPage,bag:bagPage,shop:shopPage,market:marketPage,orders:ordersPage,upgrades:upgradesPage,village:villagePage,settings:settingsPage}[route]||farmPage)()}
function dialog(title,text,action,label='ยืนยัน'){ $('#overlay').innerHTML=`<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h2 id="dialog-title">${title}</h2><p class="muted">${text}</p><div class="row"><button class="secondary" data-action="close" data-testid="dialog-cancel">ยกเลิก</button><button class="primary" data-action="${action}" data-testid="dialog-confirm">${label}</button></div></section></div>`;$('#overlay button').focus()}
function closeDialog(){$('#overlay').innerHTML=''}
function harvest(i){let p=state.plots[i];if(stage(p)!=='ready'){toast('ผักยังโตไม่เต็มที่');return}lastHarvest=p.crop;state.produce[p.crop]++;state.plots[i]={stage:'tilled'};save();go('harvest')}
function water(i){let p=state.plots[i];if(p.stage!=='planted')return false;p.stage='growing';p.readyAt=now()+CROPS[p.crop].time;return true}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.crop,i=Number(b.dataset.index);sound();
if(a==='go')go(b.dataset.route);else if(a==='back')back();else if(a==='close')closeDialog();
else if(a==='continue'){save();go('farm')}
else if(a==='new'||a==='reset'){if(hasSave)dialog('เริ่มสวนใหม่อีกครั้ง?','สวนเดิม เหรียญ ผลผลิต และอัปเกรดทั้งหมดในเบราว์เซอร์นี้จะถูกแทนที่ด้วยสวนเริ่มต้น','confirm-reset','เริ่มสวนใหม่');else{state=initial();save();go('farm')}}
else if(a==='confirm-reset'){state=initial();history=[];lastHarvest=null;shopQty={};sellQty={};save();go('farm',false);toast('สวนเล็ก ๆ พร้อมเริ่มต้นอีกครั้ง')}
else if(a==='plot'){selectedPlot=i;let p=state.plots[i],s=stage(p);if(s==='wild'){p.stage='tilled';save();render();toast('ขุดแปลงแล้ว · แตะอีกครั้งเพื่อเลือกเมล็ด')}else if(s==='tilled')go('seeds');else if(s==='ready')harvest(i);else go('growing')}
else if(a==='plant'){let p=state.plots[selectedPlot];if(p.stage!=='tilled'||!state.seeds[id])return;state.seeds[id]--;state.plots[selectedPlot]={stage:'planted',crop:id,readyAt:null};save();go('growing');toast('ปลูกแล้ว · รดน้ำเพื่อเริ่มเติบโต')}
else if(a==='water'){if(water(i)){save();render();toast('รดน้ำแล้ว ให้เวลาเขาเติบโตสักนิด')}}
else if(a==='waterall'){if(!state.upgrades.can)return;let n=0;state.plots.forEach((p,j)=>{if(water(j))n++});save();render();toast(n?`รดน้ำแล้ว ${n} แปลง`:'ทุกแปลงมีน้ำแล้ว')}
else if(a==='harvest')harvest(i);
else if(a==='demo'){state.demoOffset+=300000;save();render();toast('ขยับเวลาเดโมไปข้างหน้า 5 นาที')}
else if(a==='bagtab'){bagTab=b.dataset.tab;render()}
else if(a==='qty'){let q=b.dataset.kind==='shop'?shopQty:sellQty,max=b.dataset.kind==='shop'?99:Math.max(1,state.produce[id]);q[id]=Math.max(1,Math.min(max,(q[id]||1)+Number(b.dataset.delta)));render()}
else if(a==='buy'){let q=shopQty[id]||1,cost=q*CROPS[id].buy;if(state.coins<cost){toast('เหรียญยังไม่พอ');return}state.coins-=cost;state.seeds[id]+=q;save();render();toast(`ได้รับเมล็ด${CROPS[id].name} ${q} เมล็ด`)}
else if(a==='sell'){let q=Math.min(sellQty[id]||1,state.produce[id]);if(q<1)return;state.produce[id]-=q;state.coins+=q*CROPS[id].sell;sellQty[id]=1;save();render();toast(`ขาย${CROPS[id].name}แล้ว +${q*CROPS[id].sell} เหรียญ`)}
else if(a==='order'){if(state.orderClaimed||state.produce.lettuce<2)return;state.produce.lettuce-=2;state.coins+=45;state.xp+=20;state.orderClaimed=true;save();render();toast('คุณยายขอบใจนะ! +45 เหรียญ +20 XP')}
else if(a==='upgrade'){let k=b.dataset.upgrade,cost=k==='plots'?180:150;if(state.upgrades[k]||state.coins<cost)return;state.coins-=cost;state.upgrades[k]=true;if(k==='plots')state.plots.push({stage:'wild'},{stage:'wild'},{stage:'wild'});save();render();toast(k==='plots'?'สวนขยายเป็น 9 แปลงแล้ว':'ได้บัวรดน้ำใบใหญ่แล้ว ดูปุ่มรดน้ำทุกแปลงที่สวน')}
else if(a==='toggle'){state.settings[b.dataset.setting]=!state.settings[b.dataset.setting];save();render();if(b.dataset.setting==='sound')sound();toast('บันทึกการตั้งค่าแล้ว')}
else if(a==='save'){save();toast('บันทึกสวนเรียบร้อยแล้ว')}
else if(a==='chat')dialog('มะลิแวะมาทักทาย','“ผักในสวนนี้ไม่เหี่ยวหรอกนะ วันไหนเหนื่อยก็พักก่อน แล้วค่อยกลับมาเก็บวันหลังได้เลย”','close','ไว้เจอกันนะ');
else if(a==='rescue'){if(!rescueEligible())return;state.seeds.lettuce++;save();render();toast('ป้าพรให้เมล็ดผักกาด 1 เมล็ด · เริ่มปลูกใหม่ได้เลย')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog()});
setInterval(()=>{if(route==='farm'){let rerender=false;document.querySelectorAll('[data-timer]').forEach(el=>{let p=state.plots[Number(el.dataset.timer)];if(stage(p)==='ready')rerender=true;else el.textContent='◷ '+time(remaining(p))});if(rerender)render()}else if(route==='growing'){let p=state.plots[selectedPlot];if(p.stage==='growing'){let el=$('[data-detail-timer]');if(stage(p)==='ready'&&el&&el.textContent!=='โตแล้ว!')render();else if(el&&stage(p)!=='ready')el.textContent=time(remaining(p))}}},1000);
render();
</script></body></html>
